; Runs the Laravel scheduler inside the container: tweets:generate every
; minute and tweets:prune daily. Before this, the schedule depended on a
; task set up in Coolify, outside the repo.
[program:laravel-scheduler]
command=php /app/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=1
startsecs=0
stdout_logfile=/var/log/laravel-scheduler.log
stderr_logfile=/var/log/laravel-scheduler.log
