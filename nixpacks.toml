[phases.setup]
nixpkgsArchive = '02c087f3fe673c9e317f206a627cb6b910336dbe'
nixOverlays = ['...', 'https://github.com/veganhacktivists/nixpkgs-php-overlay/archive/a0187ebe6fcff482fa953e562c3020d4412bf1bc.tar.gz']
nixPkgs = [
    "...",
    "nodejs_24",
    "python311Packages.supervisor",
    # Fix for coollabsio/coolify/issues/4202 (LICENSE file collision)
    "(lib.recursiveUpdate php84Packages.composer { meta.priority = php84Packages.composer.meta.priority or 0 -1; })"


]

[phases.install]
cmds = [
    'php -v',
    '''php -r 'if (version_compare(PHP_VERSION, "8.4.27", "<")) { fwrite(STDERR, "PHP " . PHP_VERSION . " is older than required version\n"); exit(1); }' ''',
    'corepack enable',
    'corepack install',
    'mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx',
    'composer install --no-dev --no-interaction --no-progress --prefer-dist',
    'pnpm install --frozen-lockfile',
]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /app/nixpacks/laravel-worker.conf /etc/supervisor/conf.d/laravel-worker.conf",
    "cp /app/nixpacks/laravel-scheduler.conf /etc/supervisor/conf.d/laravel-scheduler.conf",
    "cp /app/nixpacks/supervisord.conf /etc/supervisord.conf",
    "cp /app/nixpacks/start.sh /assets/start.sh",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = '/assets/start.sh'
