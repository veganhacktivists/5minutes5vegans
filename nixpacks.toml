[phases.setup]
nixpkgsArchive = '9fc02ad42e892d6710316378f3d63ea79af87c8c'
nixPkgs = [
    "...",
    "nodejs_22",
    "python311Packages.supervisor",
    # Fix for coollabsio/coolify/issues/4202 (LICENSE file collision)
    "(lib.recursiveUpdate php84Packages.composer { meta.priority = php84Packages.composer.meta.priority or 0 -1; })"


]

[phases.install]
cmds = [
    'corepack enable',
    'corepack prepare pnpm@9.14.2 --activate',
    'mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx',
    'composer install --no-dev --no-interaction --no-progress --prefer-dist',
    'pnpm install --frozen-lockfile',
]

[phases.build]
cmds = [
    "mkdir -p /etc/supervisor/conf.d/",
    "cp /app/nixpacks/laravel-worker.conf /etc/supervisor/conf.d/laravel-worker.conf",
    "cp /app/nixpacks/supervisord.conf /etc/supervisord.conf",
    "cp /app/nixpacks/start.sh /assets/start.sh",
    "chmod +x /assets/start.sh",
    "..."
]

[start]
cmd = '/assets/start.sh'
